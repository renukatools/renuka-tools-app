<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renuka Tools - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS Library for Excel Import/Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide">RENUKA TOOLS | Master Control</h1>
        <div class="space-x-4">
            <button id="schemaBuilderBtn" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded text-sm font-bold hidden">⚙️ Create New Master</button>
            <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-sm font-bold hidden">Log Out</button>
        </div>
    </nav>

    <!-- Login Section -->
    <div id="loginSection" class="max-w-md mx-auto mt-20 bg-white p-8 border rounded shadow">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Admin Login</h2>
        <input type="email" id="email" placeholder="Admin Email" class="w-full border p-2 mb-4 rounded">
        <input type="password" id="password" placeholder="Password" class="w-full border p-2 mb-6 rounded">
        <button id="loginBtn" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-bold">Secure Login</button>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="max-w-7xl mx-auto mt-8 p-4 hidden">
        <!-- Dynamic Tabs -->
        <div id="tabContainer" class="flex space-x-2 border-b mb-6 overflow-x-auto pb-1"></div>
        
        <!-- Dynamic Tables Area -->
        <div id="tableContainer" class="bg-white p-6 rounded shadow border">
            <!-- Tables injected here via JS -->
        </div>
    </div>

    <!-- Hidden File Input for Excel Import -->
    <input type="file" id="excelUpload" class="hidden" accept=".xlsx, .xls">

    <!-- DATA ENTRY MODAL -->
    <div id="dataModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded shadow-lg w-96">
            <h3 id="modalTitle" class="text-xl font-bold mb-4">Add Item</h3>
            <input type="hidden" id="activeCollection">
            <input type="hidden" id="activeDocId">
            
            <div class="mb-4">
                <label id="lbl1" class="block text-sm font-bold mb-1"></label>
                <input type="text" id="inp1" class="w-full border p-2 rounded">
            </div>
            <div class="mb-4">
                <label id="lbl2" class="block text-sm font-bold mb-1"></label>
                <input type="number" step="0.01" id="inp2" class="w-full border p-2 rounded">
            </div>
            <div class="mb-4" id="grp3">
                <label id="lbl3" class="block text-sm font-bold mb-1"></label>
                <input type="number" step="0.01" id="inp3" class="w-full border p-2 rounded">
            </div>
            <div class="mb-6 hidden" id="grp4">
                <label id="lbl4" class="block text-sm font-bold mb-1"></label>
                <input type="number" step="0.01" id="inp4" class="w-full border p-2 rounded">
            </div>
            
            <div class="flex justify-end space-x-2">
                <button id="cancelModalBtn" class="px-4 py-2 bg-gray-300 rounded font-bold">Cancel</button>
                <button id="saveDataBtn" class="px-4 py-2 bg-blue-600 text-white font-bold rounded">Save Data</button>
            </div>
        </div>
    </div>

    <!-- NEW MASTER SCHEMA BUILDER MODAL -->
    <div id="schemaModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded shadow-lg w-[500px]">
            <h3 class="text-xl font-bold mb-4 text-purple-800">Define New Master Structure</h3>
            <p class="text-xs text-gray-500 mb-4">This will create a brand new tab and database collection.</p>
            
            <label class="block text-sm font-bold mb-1">Master Title (e.g., Sub-Contractors)</label>
            <input type="text" id="schTitle" class="w-full border p-2 rounded mb-4">
            
            <label class="block text-sm font-bold mb-1">Calculation Behavior</label>
            <select id="schBehavior" class="w-full border p-2 rounded mb-4 bg-purple-50 font-semibold">
                <option value="flat">Flat Cost Adder (₹) - Adds directly to Base Cost</option>
                <option value="variable">Variable Cost Adder (₹ × Input) - Multiplies by quantity</option>
                <option value="margin">Margin Modifier (%) - Adjusts final profit margin</option>
                <option value="lookup">Standalone Lookup - No math, just a dropdown</option>
            </select>
            
            <label class="block text-sm font-bold mb-1">Structure Type</label>
            <select id="schType" class="w-full border p-2 rounded mb-4">
                <option value="2">2 Parameters (Name + 2 numeric fields)</option>
                <option value="3">3 Parameters (Name + 3 numeric fields)</option>
            </select>

            <div class="grid grid-cols-2 gap-4 mb-6 bg-gray-50 p-4 rounded border">
                <div><label class="text-xs font-bold">Column 1 Name (Text)</label><input type="text" id="schCol1" value="Name" class="w-full border p-1 rounded text-sm"></div>
                <div><label class="text-xs font-bold">Column 2 Name (Number)</label><input type="text" id="schCol2" placeholder="e.g. Rate" class="w-full border p-1 rounded text-sm"></div>
                <div><label class="text-xs font-bold">Column 3 Name (Number)</label><input type="text" id="schCol3" placeholder="e.g. Margin" class="w-full border p-1 rounded text-sm"></div>
                <div id="schCol4Grp" class="hidden"><label class="text-xs font-bold">Column 4 Name (Number)</label><input type="text" id="schCol4" placeholder="e.g. Cost" class="w-full border p-1 rounded text-sm"></div>
            </div>

            <div class="flex justify-end space-x-2">
                <button id="cancelSchemaBtn" class="px-4 py-2 bg-gray-300 rounded font-bold">Cancel</button>
                <button id="saveSchemaBtn" class="px-4 py-2 bg-purple-600 text-white font-bold rounded">Generate Master</button>
            </div>
        </div>
    </div>

    <!-- LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        // === PASTE FIREBASE CONFIG HERE ===
        const firebaseConfig = {
            apiKey: "AIzaSyAYOA07Rta4_vXODvdoC1zIIeM4tRv5Jgs",
  authDomain: "renuka-tools-quote.firebaseapp.com",
  databaseURL: "https://renuka-tools-quote-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "renuka-tools-quote",
  storageBucket: "renuka-tools-quote.firebasestorage.app",
  messagingSenderId: "300959855269",
  appId: "1:300959855269:web:d8d19e979ac3616b10934c"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let appSchemas = []; 
        let currentTabId = "customer_tiers"; 
        let pendingImportCollection = "";

        // Default Masters now include the mathematical behavior mapping
        const defaultSchemas = [
            { id: "customer_tiers", title: "Customer Tiers", cols: ["Tier Name", "Floor Margin (%)", "Trading Margin (%)"], params: 2, behavior: "margin" },
            { id: "tool_categories", title: "Tool Categories", cols: ["Category Name", "Criticality (%)", "Escalation (%)"], params: 2, behavior: "margin" },
            { id: "raw_materials", title: "Raw Materials", cols: ["Grade", "Density", "Cost (₹/kg)"], params: 2, behavior: "variable" },
            { id: "operations", title: "Operations Cost", cols: ["Machine", "Hourly Rate (₹)", "Setup Cost (₹)"], params: 2, behavior: "variable" },
            { id: "blanks", title: "Standard Blanks", cols: ["Taper Name", "Dia (mm)", "Max GPL (mm)", "Cost (₹)"], params: 3, behavior: "lookup" },
            { id: "standard_items", title: "Standard Products", cols: ["Item Name", "List Price (₹)", "Max Discount (%)"], params: 2, behavior: "lookup" }
        ];

        // --- AUTH ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                document.getElementById('schemaBuilderBtn').classList.remove('hidden');
                await initializeSchemas();
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('dashboardSection').classList.add('hidden');
                document.getElementById('logoutBtn').classList.add('hidden');
                document.getElementById('schemaBuilderBtn').classList.add('hidden');
            }
        });

        document.getElementById('loginBtn').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).catch(() => alert("Invalid credentials"));
        });
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        // --- SCHEMA BOOTSTRAPPER ---
        async function initializeSchemas() {
            const snap = await getDocs(collection(db, "system_schemas"));
            if (snap.empty) {
                for (let schema of defaultSchemas) {
                    await setDoc(doc(db, "system_schemas", schema.id), schema);
                }
                appSchemas = defaultSchemas;
            } else {
                appSchemas = [];
                snap.forEach(doc => appSchemas.push(doc.data()));
            }
            renderArchitecture();
        }

        // --- RENDER DYNAMIC UI ---
        function renderArchitecture() {
            const tabsDiv = document.getElementById('tabContainer');
            const tablesDiv = document.getElementById('tableContainer');
            tabsDiv.innerHTML = "";
            tablesDiv.innerHTML = "";

            appSchemas.forEach((sch, index) => {
                let isActive = (sch.id === currentTabId);
                if(index === 0 && !appSchemas.find(s => s.id === currentTabId)) { isActive = true; currentTabId = sch.id; }
                
                tabsDiv.innerHTML += `
                    <button onclick="window.switchTab('${sch.id}')" 
                        class="tab-btn px-4 py-2 font-bold whitespace-nowrap ${isActive ? 'bg-white border-t border-l border-r rounded-t text-blue-900' : 'text-gray-600 hover:text-blue-900'}">
                        ${sch.title}
                    </button>`;

                let tableHtml = `
                    <div id="section_${sch.id}" class="tab-section ${isActive ? '' : 'hidden'}">
                        <div class="flex justify-between items-center mb-4">
                            <div>
                                <h3 class="text-lg font-bold">${sch.title} Data</h3>
                                <p class="text-xs text-purple-600 font-bold uppercase tracking-wide">Behavior: ${sch.behavior}</p>
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="window.downloadTemplate('${sch.id}')" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded text-sm font-bold">📥 Template</button>
                                <button onclick="window.triggerImport('${sch.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded text-sm font-bold">📤 Import Excel</button>
                                <button onclick="window.exportExcel('${sch.id}')" class="bg-teal-600 hover:bg-teal-700 text-white px-3 py-1 rounded text-sm font-bold">📊 Export Excel</button>
                                <button onclick="window.openEntryModal('${sch.id}')" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm font-bold">+ Add Item</button>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-gray-100 text-gray-600 text-sm border-b">
                                <tr>
                                    <th class="p-3">${sch.cols[0]}</th>
                                    <th class="p-3">${sch.cols[1]}</th>
                                    <th class="p-3">${sch.cols[2]}</th>
                                    ${sch.params === 3 ? `<th class="p-3">${sch.cols[3]}</th>` : ''}
                                    <th class="p-3 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tbody_${sch.id}"></tbody>
                        </table>
                        </div>
                    </div>`;
                tablesDiv.innerHTML += tableHtml;
            });

            loadDataForAllTables();
        }

        window.switchTab = (id) => {
            currentTabId = id;
            renderArchitecture();
        };

        // --- FETCH DATA ---
        async function loadDataForAllTables() {
            for (let sch of appSchemas) {
                const tbody = document.getElementById(`tbody_${sch.id}`);
                if (!tbody) continue;
                let html = "";
                const snap = await getDocs(collection(db, sch.id));
                snap.forEach(docSnap => {
                    const d = docSnap.data();
                    html += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-3">${d.name || ''}</td>
                            <td class="p-3">${d.param1 || 0}</td>
                            <td class="p-3">${d.param2 || 0}</td>
                            ${sch.params === 3 ? `<td class="p-3">${d.param3 || 0}</td>` : ''}
                            <td class="p-3 text-right">
                                <button class="text-blue-600 mr-2 font-bold" onclick="window.openEntryModal('${sch.id}', '${docSnap.id}')">Edit</button>
                                <button class="text-red-600 font-bold" onclick="window.deleteItem('${sch.id}','${docSnap.id}')">Del</button>
                            </td>
                        </tr>`;
                });
                tbody.innerHTML = html;
            }
        }

        // --- DATA ENTRY MODAL (MANUAL) ---
        window.openEntryModal = async (schemaId, docId = "") => {
            const sch = appSchemas.find(s => s.id === schemaId);
            document.getElementById('modalTitle').innerText = docId ? `Edit ${sch.title}` : `Add ${sch.title}`;
            document.getElementById('activeCollection').value = sch.id;
            document.getElementById('activeDocId').value = docId;
            
            document.getElementById('lbl1').innerText = sch.cols[0]; document.getElementById('inp1').value = "";
            document.getElementById('lbl2').innerText = sch.cols[1]; document.getElementById('inp2').value = "";
            document.getElementById('lbl3').innerText = sch.cols[2]; document.getElementById('inp3').value = "";
            
            if (sch.params === 3) {
                document.getElementById('grp4').classList.remove('hidden');
                document.getElementById('lbl4').innerText = sch.cols[3]; document.getElementById('inp4').value = "";
            } else {
                document.getElementById('grp4').classList.add('hidden');
            }

            document.getElementById('dataModal').classList.remove('hidden');
        };

        document.getElementById('cancelModalBtn').addEventListener('click', () => document.getElementById('dataModal').classList.add('hidden'));

        document.getElementById('saveDataBtn').addEventListener('click', async () => {
            const col = document.getElementById('activeCollection').value;
            const id = document.getElementById('activeDocId').value;
            const sch = appSchemas.find(s => s.id === col);
            
            const dataObj = {
                name: document.getElementById('inp1').value,
                param1: Number(document.getElementById('inp2').value),
                param2: Number(document.getElementById('inp3').value)
            };
            if (sch.params === 3) dataObj.param3 = Number(document.getElementById('inp4').value);

            try {
                if (id) await updateDoc(doc(db, col, id), dataObj);
                else await addDoc(collection(db, col), dataObj);
                document.getElementById('dataModal').classList.add('hidden');
                loadDataForAllTables();
            } catch (err) { alert("Error saving"); }
        });

        window.deleteItem = async (col, id) => {
            if(confirm("Delete this record permanently?")) {
                await deleteDoc(doc(db, col, id));
                loadDataForAllTables();
            }
        };

        // --- NEW MASTER SCHEMA BUILDER ---
        document.getElementById('schemaBuilderBtn').addEventListener('click', () => {
            document.getElementById('schemaModal').classList.remove('hidden');
        });
        document.getElementById('schType').addEventListener('change', (e) => {
            if(e.target.value === "3") document.getElementById('schCol4Grp').classList.remove('hidden');
            else document.getElementById('schCol4Grp').classList.add('hidden');
        });
        document.getElementById('cancelSchemaBtn').addEventListener('click', () => document.getElementById('schemaModal').classList.add('hidden'));

        document.getElementById('saveSchemaBtn').addEventListener('click', async () => {
            const title = document.getElementById('schTitle').value;
            const id = title.toLowerCase().replace(/[^a-z0-9]/g, '_');
            const behavior = document.getElementById('schBehavior').value;
            const params = Number(document.getElementById('schType').value);
            const cols = [document.getElementById('schCol1').value, document.getElementById('schCol2').value, document.getElementById('schCol3').value];
            if(params === 3) cols.push(document.getElementById('schCol4').value);

            if(!title) return alert("Title required");
            const newSchema = { id, title, params, cols, behavior };

            await setDoc(doc(db, "system_schemas", id), newSchema);
            document.getElementById('schemaModal').classList.add('hidden');
            await initializeSchemas(); 
        });

        // --- EXCEL ENGINE (IMPORT/EXPORT/TEMPLATE) ---
        window.downloadTemplate = (schemaId) => {
            const sch = appSchemas.find(s => s.id === schemaId);
            const ws = XLSX.utils.aoa_to_sheet([sch.cols]); 
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Template");
            XLSX.writeFile(wb, `${sch.title}_Template.xlsx`);
        };

        window.exportExcel = async (schemaId) => {
            const sch = appSchemas.find(s => s.id === schemaId);
            const snap = await getDocs(collection(db, schemaId));
            let dataArr = [];
            snap.forEach(docSnap => {
                let d = docSnap.data();
                let row = {};
                row[sch.cols[0]] = d.name;
                row[sch.cols[1]] = d.param1;
                row[sch.cols[2]] = d.param2;
                if(sch.params === 3) row[sch.cols[3]] = d.param3;
                dataArr.push(row);
            });
            const ws = XLSX.utils.json_to_sheet(dataArr);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, sch.title);
            XLSX.writeFile(wb, `${sch.title}_Export.xlsx`);
        };

        window.triggerImport = (schemaId) => {
            pendingImportCollection = schemaId;
            document.getElementById('excelUpload').click();
        };

        document.getElementById('excelUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                
                const sch = appSchemas.find(s => s.id === pendingImportCollection);
                let count = 0;
                
                for(let row of jsonData) {
                    const dataObj = {
                        name: String(row[sch.cols[0]] || "Unnamed"),
                        param1: Number(row[sch.cols[1]] || 0),
                        param2: Number(row[sch.cols[2]] || 0)
                    };
                    if(sch.params === 3) dataObj.param3 = Number(row[sch.cols[3]] || 0);
                    
                    await addDoc(collection(db, pendingImportCollection), dataObj);
                    count++;
                }
                document.getElementById('excelUpload').value = ""; 
                alert(`Successfully imported ${count} items into ${sch.title}!`);
                loadDataForAllTables();
            };
            reader.readAsArrayBuffer(file);
        });

    </script>
</body>
</html>
