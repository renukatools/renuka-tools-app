<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renuka Tools - Master Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide">RENUKA TOOLS | ERP Master Control</h1>
        <div class="space-x-4">
            <button id="schemaBuilderBtn" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded text-sm font-bold hidden">⚙️ Custom Master</button>
            <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-sm font-bold hidden">Log Out</button>
        </div>
    </nav>

    <!-- Login Section -->
    <div id="loginSection" class="max-w-md mx-auto mt-20 bg-white p-8 border rounded shadow">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Admin Login</h2>
        <input type="email" id="email" placeholder="Admin Email" class="w-full border p-2 mb-4 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="password" id="password" placeholder="Password" class="w-full border p-2 mb-6 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button id="loginBtn" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-bold">Secure Login</button>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="max-w-[95%] mx-auto mt-8 p-4 hidden">
        <div id="tabContainer" class="flex space-x-1 border-b mb-6 overflow-x-auto pb-1 custom-scrollbar"></div>
        <div id="tableContainer" class="bg-white p-6 rounded shadow border min-h-[500px]"></div>
    </div>

    <input type="file" id="excelUpload" class="hidden" accept=".xlsx, .xls">

    <!-- DATA ENTRY MODAL (With Active Toggle) -->
    <div id="dataModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded shadow-lg w-96">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-xl font-bold text-gray-800">Add Item</h3>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="isActive" class="w-4 h-4 text-blue-600 rounded" checked>
                    <label class="text-sm font-bold text-gray-700">Active</label>
                </div>
            </div>
            
            <input type="hidden" id="activeCollection">
            <input type="hidden" id="activeDocId">
            
            <div class="mb-4">
                <label id="lbl1" class="block text-sm font-bold mb-1 text-gray-600"></label>
                <input type="text" id="inp1" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-4 hidden" id="grp2">
                <label id="lbl2" class="block text-sm font-bold mb-1 text-gray-600"></label>
                <input type="number" step="0.01" id="inp2" class="w-full border p-2 rounded">
            </div>
            <div class="mb-4 hidden" id="grp3">
                <label id="lbl3" class="block text-sm font-bold mb-1 text-gray-600"></label>
                <input type="number" step="0.01" id="inp3" class="w-full border p-2 rounded">
            </div>
            <div class="mb-6 hidden" id="grp4">
                <label id="lbl4" class="block text-sm font-bold mb-1 text-gray-600"></label>
                <input type="number" step="0.01" id="inp4" class="w-full border p-2 rounded">
            </div>
            
            <div class="flex justify-end space-x-2 border-t pt-4">
                <button id="cancelModalBtn" class="px-4 py-2 bg-gray-300 hover:bg-gray-400 rounded font-bold">Cancel</button>
                <button id="saveDataBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded">Save Data</button>
            </div>
        </div>
    </div>

    <!-- SCHEMA BUILDER MODAL -->
    <div id="schemaModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded shadow-lg w-[500px]">
            <h3 class="text-xl font-bold mb-2 text-purple-800">Define New Master</h3>
            <label class="block text-sm font-bold mb-1">Master Title</label>
            <input type="text" id="schTitle" class="w-full border p-2 rounded mb-4" placeholder="e.g. Laser Marking">
            
            <label class="block text-sm font-bold mb-1">Calculation Behavior</label>
            <select id="schBehavior" class="w-full border p-2 rounded mb-4 bg-purple-50 font-semibold">
                <option value="flat">Flat Cost Adder (₹)</option>
                <option value="variable">Variable Cost Adder (₹ × Qty/Hrs)</option>
                <option value="margin">Margin Modifier (%)</option>
                <option value="lookup">Standalone Lookup (Dropdown only)</option>
            </select>
            
            <label class="block text-sm font-bold mb-1">Data Columns Needed</label>
            <select id="schType" class="w-full border p-2 rounded mb-4">
                <option value="1">1 Column (Name only)</option>
                <option value="2">2 Columns (Name + 1 Value)</option>
                <option value="3">3 Columns (Name + 2 Values)</option>
                <option value="4">4 Columns (Name + 3 Values)</option>
            </select>

            <div class="grid grid-cols-2 gap-4 mb-6 bg-gray-50 p-4 rounded border">
                <div><label class="text-xs font-bold">Col 1 (Text)</label><input type="text" id="schCol1" value="Name" class="w-full border p-1 rounded text-sm"></div>
                <div id="schCol2Grp" class="hidden"><label class="text-xs font-bold">Col 2 (Number)</label><input type="text" id="schCol2" class="w-full border p-1 rounded text-sm"></div>
                <div id="schCol3Grp" class="hidden"><label class="text-xs font-bold">Col 3 (Number)</label><input type="text" id="schCol3" class="w-full border p-1 rounded text-sm"></div>
                <div id="schCol4Grp" class="hidden"><label class="text-xs font-bold">Col 4 (Number)</label><input type="text" id="schCol4" class="w-full border p-1 rounded text-sm"></div>
            </div>

            <div class="flex justify-end space-x-2">
                <button id="cancelSchemaBtn" class="px-4 py-2 bg-gray-300 rounded font-bold">Cancel</button>
                <button id="saveSchemaBtn" class="px-4 py-2 bg-purple-600 text-white font-bold rounded">Generate Master</button>
            </div>
        </div>
    </div>

    <!-- LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        // === PASTE YOUR FIREBASE CONFIG HERE ===
        const firebaseConfig = {
            apiKey: "AIzaSyAYOA07Rta4_vXODvdoC1zIIeM4tRv5Jgs",
  authDomain: "renuka-tools-quote.firebaseapp.com",
  databaseURL: "https://renuka-tools-quote-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "renuka-tools-quote",
  storageBucket: "renuka-tools-quote.firebasestorage.app",
  messagingSenderId: "300959855269",
  appId: "1:300959855269:web:d8d19e979ac3616b10934c"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let appSchemas = []; 
        let currentTabId = "customer_tiers"; 
        let pendingImportCollection = "";

        // The Ultimate ERP Master Architecture
        const defaultSchemas = [
            { id: "customer_tiers", title: "Customer Tiers", cols: ["Tier Name", "Floor Margin (%)", "Trading Margin (%)"], params: 3, behavior: "margin" },
            { id: "tool_categories", title: "Tool Categories", cols: ["Category Name", "Criticality (%)", "Escalation (%)"], params: 3, behavior: "margin" },
            { id: "raw_materials", title: "Raw Materials", cols: ["Grade", "Density (g/cm³)", "Cost (₹/kg)"], params: 3, behavior: "variable" },
            { id: "blanks", title: "Taper Blanks", cols: ["Taper Name", "Dia (mm)", "Max GPL (mm)", "Cost (₹)"], params: 4, behavior: "lookup" },
            { id: "operations", title: "Machine Operations", cols: ["Machine", "Hourly Rate (₹)", "Setup Cost (₹)"], params: 3, behavior: "variable" },
            { id: "features", title: "Features & Pocketing", cols: ["Feature Name", "Rate per Qty (₹)"], params: 2, behavior: "variable" },
            { id: "assembly", title: "Assembly & Surface", cols: ["Process Name", "Flat Cost (₹)"], params: 2, behavior: "flat" },
            { id: "spares", title: "Spares & Standard Items", cols: ["Item Name", "List Price (₹)", "Max Disc (%)"], params: 3, behavior: "lookup" },
            { id: "freight", title: "Freight & Transport", cols: ["Method", "Rate (₹/kg)", "Flat Cost (₹)"], params: 3, behavior: "variable" },
            { id: "payment_terms", title: "Payment Terms", cols: ["Description"], params: 1, behavior: "lookup" },
            { id: "inco_terms", title: "INCO / Shipping Terms", cols: ["Term Description"], params: 1, behavior: "lookup" }
        ];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                document.getElementById('schemaBuilderBtn').classList.remove('hidden');
                await initializeSchemas();
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('dashboardSection').classList.add('hidden');
                document.getElementById('logoutBtn').classList.add('hidden');
                document.getElementById('schemaBuilderBtn').classList.add('hidden');
            }
        });

        document.getElementById('loginBtn').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).catch(() => alert("Invalid credentials"));
        });
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        async function initializeSchemas() {
            const snap = await getDocs(collection(db, "system_schemas"));
            appSchemas = [];
            
            // Auto-inject full 11-master schema if empty OR missing critical masters
            if (snap.empty || snap.size < 11) {
                for (let schema of defaultSchemas) {
                    await setDoc(doc(db, "system_schemas", schema.id), schema);
                }
                appSchemas = defaultSchemas;
            } else {
                snap.forEach(doc => appSchemas.push(doc.data()));
            }
            renderArchitecture();
        }

        function renderArchitecture() {
            const tabsDiv = document.getElementById('tabContainer');
            const tablesDiv = document.getElementById('tableContainer');
            tabsDiv.innerHTML = "";
            tablesDiv.innerHTML = "";

            appSchemas.forEach((sch, index) => {
                let isActive = (sch.id === currentTabId);
                if(index === 0 && !appSchemas.find(s => s.id === currentTabId)) { isActive = true; currentTabId = sch.id; }
                
                tabsDiv.innerHTML += `
                    <button onclick="window.switchTab('${sch.id}')" 
                        class="tab-btn px-4 py-2 font-bold text-sm whitespace-nowrap ${isActive ? 'bg-white border-t border-l border-r rounded-t text-blue-900 shadow-sm' : 'text-gray-500 hover:text-blue-900 bg-gray-100 border'}">
                        ${sch.title}
                    </button>`;

                let thHtml = sch.cols.map(c => `<th class="p-3">${c}</th>`).join('');
                
                let tableHtml = `
                    <div id="section_${sch.id}" class="tab-section ${isActive ? '' : 'hidden'}">
                        <div class="flex justify-between items-center mb-6">
                            <div>
                                <h3 class="text-xl font-bold text-gray-800">${sch.title}</h3>
                                <p class="text-xs text-blue-600 font-bold uppercase tracking-wide">Behavior Rule: ${sch.behavior}</p>
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="window.downloadTemplate('${sch.id}')" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2 rounded text-sm font-bold">📥 Template</button>
                                <button onclick="window.triggerImport('${sch.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded text-sm font-bold">📤 Import Excel</button>
                                <button onclick="window.exportExcel('${sch.id}')" class="bg-teal-600 hover:bg-teal-700 text-white px-3 py-2 rounded text-sm font-bold">📊 Export Data</button>
                                <button onclick="window.openEntryModal('${sch.id}')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm font-bold">+ Add Record</button>
                            </div>
                        </div>
                        <div class="overflow-x-auto rounded border">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-gray-100 text-gray-700 text-sm border-b">
                                <tr>${thHtml}<th class="p-3">Status</th><th class="p-3 text-right">Actions</th></tr>
                            </thead>
                            <tbody id="tbody_${sch.id}"></tbody>
                        </table>
                        </div>
                    </div>`;
                tablesDiv.innerHTML += tableHtml;
            });

            loadDataForAllTables();
        }

        window.switchTab = (id) => { currentTabId = id; renderArchitecture(); };

        async function loadDataForAllTables() {
            for (let sch of appSchemas) {
                const tbody = document.getElementById(`tbody_${sch.id}`);
                if (!tbody) continue;
                let html = "";
                const snap = await getDocs(collection(db, sch.id));
                snap.forEach(docSnap => {
                    const d = docSnap.data();
                    const activeBadge = (d.isActive !== false) ? 
                        `<span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded font-bold">Active</span>` : 
                        `<span class="bg-red-100 text-red-800 text-xs px-2 py-1 rounded font-bold">Inactive</span>`;
                    
                    let trCols = `<td class="p-3 font-medium">${d.name || ''}</td>`;
                    if(sch.params >= 2) trCols += `<td class="p-3">${d.param1 || 0}</td>`;
                    if(sch.params >= 3) trCols += `<td class="p-3">${d.param2 || 0}</td>`;
                    if(sch.params >= 4) trCols += `<td class="p-3">${d.param3 || 0}</td>`;
                    
                    html += `
                        <tr class="border-b hover:bg-gray-50 text-sm">
                            ${trCols}
                            <td class="p-3">${activeBadge}</td>
                            <td class="p-3 text-right">
                                <button class="text-blue-600 hover:underline font-bold mr-2" onclick="window.openEntryModal('${sch.id}', '${docSnap.id}')">Edit</button>
                                <button class="text-red-600 hover:underline font-bold" onclick="window.deleteItem('${sch.id}','${docSnap.id}')">Del</button>
                            </td>
                        </tr>`;
                });
                tbody.innerHTML = html;
            }
        }

        window.openEntryModal = async (schemaId, docId = "") => {
            const sch = appSchemas.find(s => s.id === schemaId);
            document.getElementById('modalTitle').innerText = docId ? `Edit ${sch.title}` : `Add to ${sch.title}`;
            document.getElementById('activeCollection').value = sch.id;
            document.getElementById('activeDocId').value = docId;
            
            // Reset fields & groupings
            [2,3,4].forEach(n => document.getElementById(`grp${n}`).classList.add('hidden'));
            document.getElementById('inp1').value = ""; document.getElementById('inp2').value = "";
            document.getElementById('inp3').value = ""; document.getElementById('inp4').value = "";
            document.getElementById('isActive').checked = true;

            // Display needed inputs based on schema params (1 to 4)
            document.getElementById('lbl1').innerText = sch.cols[0];
            if(sch.params >= 2) { document.getElementById('grp2').classList.remove('hidden'); document.getElementById('lbl2').innerText = sch.cols[1]; }
            if(sch.params >= 3) { document.getElementById('grp3').classList.remove('hidden'); document.getElementById('lbl3').innerText = sch.cols[2]; }
            if(sch.params >= 4) { document.getElementById('grp4').classList.remove('hidden'); document.getElementById('lbl4').innerText = sch.cols[3]; }

            document.getElementById('dataModal').classList.remove('hidden');
        };

        document.getElementById('cancelModalBtn').addEventListener('click', () => document.getElementById('dataModal').classList.add('hidden'));

        document.getElementById('saveDataBtn').addEventListener('click', async () => {
            const col = document.getElementById('activeCollection').value;
            const id = document.getElementById('activeDocId').value;
            const sch = appSchemas.find(s => s.id === col);
            
            const dataObj = { 
                name: document.getElementById('inp1').value,
                isActive: document.getElementById('isActive').checked 
            };
            if (sch.params >= 2) dataObj.param1 = Number(document.getElementById('inp2').value);
            if (sch.params >= 3) dataObj.param2 = Number(document.getElementById('inp3').value);
            if (sch.params >= 4) dataObj.param3 = Number(document.getElementById('inp4').value);

            try {
                if (id) await updateDoc(doc(db, col, id), dataObj);
                else await addDoc(collection(db, col), dataObj);
                document.getElementById('dataModal').classList.add('hidden');
                loadDataForAllTables();
            } catch (err) { alert("Error saving data."); }
        });

        window.deleteItem = async (col, id) => {
            if(confirm("Delete permanently? (Recommended: Just mark as 'Inactive' instead if quotes are using this)")) {
                await deleteDoc(doc(db, col, id));
                loadDataForAllTables();
            }
        };

        // --- Custom Schema Builder logic & Excel Engine kept exactly the same... ---
        document.getElementById('schemaBuilderBtn').addEventListener('click', () => document.getElementById('schemaModal').classList.remove('hidden'));
        document.getElementById('cancelSchemaBtn').addEventListener('click', () => document.getElementById('schemaModal').classList.add('hidden'));
        document.getElementById('schType').addEventListener('change', (e) => {
            const val = Number(e.target.value);
            document.getElementById('schCol2Grp').classList.toggle('hidden', val < 2);
            document.getElementById('schCol3Grp').classList.toggle('hidden', val < 3);
            document.getElementById('schCol4Grp').classList.toggle('hidden', val < 4);
        });

        document.getElementById('saveSchemaBtn').addEventListener('click', async () => {
            const title = document.getElementById('schTitle').value;
            if(!title) return alert("Title required");
            const id = title.toLowerCase().replace(/[^a-z0-9]/g, '_');
            const behavior = document.getElementById('schBehavior').value;
            const params = Number(document.getElementById('schType').value);
            
            let cols = [document.getElementById('schCol1').value];
            if(params >= 2) cols.push(document.getElementById('schCol2').value);
            if(params >= 3) cols.push(document.getElementById('schCol3').value);
            if(params >= 4) cols.push(document.getElementById('schCol4').value);

            await setDoc(doc(db, "system_schemas", id), { id, title, params, cols, behavior });
            document.getElementById('schemaModal').classList.add('hidden');
            await initializeSchemas(); 
        });

        // Template logic
        window.downloadTemplate = (schemaId) => {
            const sch = appSchemas.find(s => s.id === schemaId);
            const ws = XLSX.utils.aoa_to_sheet([sch.cols]); 
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Template");
            XLSX.writeFile(wb, `${sch.title}_Template.xlsx`);
        };

        // Import logic (Always sets isActive to true on mass upload)
        window.triggerImport = (schemaId) => { pendingImportCollection = schemaId; document.getElementById('excelUpload').click(); };
        document.getElementById('excelUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                const sch = appSchemas.find(s => s.id === pendingImportCollection);
                let count = 0;
                for(let row of jsonData) {
                    const dataObj = { name: String(row[sch.cols[0]] || "Unnamed"), isActive: true };
                    if(sch.params >= 2) dataObj.param1 = Number(row[sch.cols[1]] || 0);
                    if(sch.params >= 3) dataObj.param2 = Number(row[sch.cols[2]] || 0);
                    if(sch.params >= 4) dataObj.param3 = Number(row[sch.cols[3]] || 0);
                    await addDoc(collection(db, pendingImportCollection), dataObj);
                    count++;
                }
                document.getElementById('excelUpload').value = ""; 
                alert(`Successfully imported ${count} items!`);
                loadDataForAllTables();
            };
            reader.readAsArrayBuffer(file);
        });

        // Export logic
        window.exportExcel = async (schemaId) => {
            const sch = appSchemas.find(s => s.id === schemaId);
            const snap = await getDocs(collection(db, schemaId));
            let dataArr = [];
            snap.forEach(docSnap => {
                let d = docSnap.data();
                let row = {};
                row[sch.cols[0]] = d.name;
                if(sch.params >= 2) row[sch.cols[1]] = d.param1;
                if(sch.params >= 3) row[sch.cols[2]] = d.param2;
                if(sch.params >= 4) row[sch.cols[3]] = d.param3;
                row["Is Active"] = (d.isActive !== false) ? "Yes" : "No";
                dataArr.push(row);
            });
            const ws = XLSX.utils.json_to_sheet(dataArr);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, sch.title);
            XLSX.writeFile(wb, `${sch.title}_Export.xlsx`);
        };
    </script>
</body>
</html>
