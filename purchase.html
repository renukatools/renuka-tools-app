<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Renuka Tools | Purchase Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar{width:6px;height:6px}
        .custom-scrollbar::-webkit-scrollbar-thumb{background:#10b981;border-radius:4px}
        .active-nav{background-color:#047857;border-left:4px solid #34d399;color:white}
        #sidebar { transition: transform 0.3s ease-in-out; }
        body { background: #f8fafc; }
    </style>
</head>
<body class="h-screen flex overflow-hidden font-sans text-gray-800 antialiased">
    
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center hidden transition-opacity duration-500">
        <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-2xl">
            <h2 class="text-3xl font-black text-center text-gray-900 tracking-tight mb-2">RENUKA TOOLS</h2>
            <p class="text-xs text-center text-emerald-600 font-bold uppercase tracking-widest mb-8">Procurement & Costing Auth</p>
            <input type="email" id="email" placeholder="Work Email" class="w-full border-2 border-gray-200 p-3 mb-4 rounded-lg focus:border-emerald-500 outline-none font-semibold transition">
            <input type="password" id="password" placeholder="Password" class="w-full border-2 border-gray-200 p-3 mb-6 rounded-lg focus:border-emerald-500 outline-none font-semibold transition">
            <button id="loginBtn" class="w-full bg-emerald-600 text-white p-4 rounded-lg font-bold hover:bg-emerald-700 shadow-lg shadow-emerald-500/30 transition flex justify-center items-center">
                <span>Access Cost Master</span>
            </button>
        </div>
    </div>

    <!-- MOBILE OVERLAY -->
    <div id="mobileOverlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <div id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-gray-900 text-gray-300 flex flex-col h-full shadow-2xl z-40 transform -translate-x-full lg:relative lg:translate-x-0">
        <div class="p-5 bg-gray-950 border-b border-gray-800 flex justify-between items-center">
            <div><h1 class="text-xl font-bold text-white tracking-wider">PROCUREMENT</h1><p class="text-[10px] text-emerald-400 font-bold uppercase tracking-widest mt-1 flex items-center"><span class="w-2 h-2 bg-green-400 rounded-full animate-pulse mr-2"></span> Cost Master DB</p></div>
            <button class="lg:hidden text-gray-400 hover:text-white font-bold text-xl" onclick="toggleSidebar()">✕</button>
        </div>
        <div class="flex-1 overflow-y-auto custom-scrollbar py-4">
            <div class="px-4 mb-2"><p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Raw Material Costs</p></div>
            <div id="nav-mfg" class="space-y-1 mb-4"></div>
            <div class="px-4 mb-2 border-t border-gray-800 pt-4"><p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Trading & Spares</p></div>
            <div id="nav-com" class="space-y-1 mb-4"></div>
        </div>
        <div class="p-4 bg-gray-950 border-t border-gray-800 space-y-2">
            <div class="text-xs text-gray-500 mb-2 truncate border-b border-gray-800 pb-2" id="userBadge"></div>
            <a href="index.html" class="w-full bg-yellow-600 hover:bg-yellow-700 text-white py-2.5 rounded-lg text-sm font-bold shadow transition text-center block mb-2">🏠 Main Hub</a>
            <a href="sales.html" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-sm font-bold shadow transition text-center block mb-2">🛒 Sales Engine</a>
            <button id="schemaBuilderBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-2.5 rounded-lg text-sm font-bold shadow transition mb-2">⚙️ Create Cost Master</button>
            <button id="logoutBtn" class="w-full bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-lg text-sm font-bold shadow transition">Log Out</button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col h-full w-full relative">
        <header class="bg-white shadow-sm border-b px-4 sm:px-6 py-4 flex justify-between items-center z-10">
            <div class="flex items-center space-x-3">
                <button class="lg:hidden text-gray-600 focus:outline-none" onclick="toggleSidebar()"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
                <h2 id="pageTitle" class="text-lg sm:text-2xl font-bold text-gray-800 truncate">Dashboard</h2>
            </div>
            <div class="flex space-x-2 sm:space-x-3 overflow-x-auto no-scrollbar" id="topActionButtons"></div>
        </header>
        
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 custom-scrollbar w-full">
            <div id="tableContainer" class="bg-white rounded-xl shadow-sm border min-h-[50vh] sm:min-h-[500px]"></div>
        </main>
    </div>

    <!-- UNIVERSAL ENTRY MODAL -->
    <input type="file" id="excelUpload" class="hidden" accept=".xlsx, .xls">
    
    <div id="dataModal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center z-50 backdrop-blur-sm p-4 transition-opacity">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex justify-between items-center mb-5 border-b pb-3">
                <h3 id="modalTitle" class="text-xl font-black text-gray-800 truncate">Add Record</h3>
                <div class="flex items-center space-x-2 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200 cursor-pointer hover:bg-slate-200 transition" onclick="document.getElementById('isActive').click()">
                    <input type="checkbox" id="isActive" class="w-4 h-4 text-emerald-600 rounded cursor-pointer pointer-events-none" checked>
                    <label class="text-xs font-bold text-gray-700 cursor-pointer pointer-events-none">Active</label>
                </div>
            </div>
            <input type="hidden" id="activeCollection"><input type="hidden" id="activeDocId">
            <div class="space-y-4">
                <div id="grp1"><label id="lbl1" class="block text-[10px] font-bold mb-1 text-gray-500 uppercase tracking-wide"></label><input type="text" id="inp1" class="w-full border-2 border-gray-200 p-2.5 rounded-lg focus:border-emerald-500 outline-none text-sm font-bold text-gray-800 transition"></div>
                <div class="hidden" id="grp2"><label id="lbl2" class="block text-[10px] font-bold mb-1 text-gray-500 uppercase tracking-wide"></label><input type="text" id="inp2" class="w-full border-2 border-gray-200 p-2.5 rounded-lg focus:border-emerald-500 outline-none text-sm font-semibold transition"></div>
                <div class="hidden" id="grp3"><label id="lbl3" class="block text-[10px] font-bold mb-1 text-gray-500 uppercase tracking-wide"></label><input type="text" id="inp3" class="w-full border-2 border-gray-200 p-2.5 rounded-lg focus:border-emerald-500 outline-none text-sm font-semibold transition"></div>
                <div class="hidden" id="grp4"><label id="lbl4" class="block text-[10px] font-bold mb-1 text-gray-500 uppercase tracking-wide"></label><input type="text" id="inp4" class="w-full border-2 border-gray-200 p-2.5 rounded-lg focus:border-emerald-500 outline-none text-sm font-semibold transition"></div>
            </div>
            <div class="flex justify-end space-x-3 border-t mt-6 pt-4">
                <button id="cancelModalBtn" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg font-bold transition">Cancel</button>
                <button id="saveDataBtn" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-lg shadow-emerald-500/30 transition">Save Cost Record</button>
            </div>
        </div>
    </div>

    <!-- SCHEMA BUILDER MODAL (Costing Focused) -->
    <div id="schemaModal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center z-50 backdrop-blur-sm p-4 transition-opacity">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-lg">
            <h3 class="text-xl font-black mb-4 text-emerald-800 border-b pb-2">Deploy Custom Cost Master</h3>
            <p class="text-xs text-gray-500 mb-6 font-semibold">Databases created here automatically sync to the global Sales Engine in real-time.</p>
            
            <div class="space-y-4">
                <div><label class="block text-[10px] font-bold mb-1 uppercase tracking-wide text-gray-500">Master Title</label><input type="text" id="schTitle" class="w-full border-2 border-gray-200 p-2.5 rounded-lg text-sm focus:border-emerald-500 outline-none font-bold transition" placeholder="e.g. PVD Coating Costs"></div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-[10px] font-bold mb-1 uppercase tracking-wide text-gray-500">Module Category</label><select id="schCat" class="w-full border-2 border-gray-200 p-2.5 rounded-lg text-sm font-bold text-slate-700 focus:border-emerald-500 outline-none transition"><option value="mfg">Manufacturing Cost (BOM)</option><option value="com">Commercial / Trading Cost</option></select></div>
                    <div><label class="block text-[10px] font-bold mb-1 uppercase tracking-wide text-gray-500">Calculation Behavior</label><select id="schBehavior" class="w-full border-2 border-gray-200 p-2.5 rounded-lg bg-emerald-50 text-emerald-900 text-sm font-bold focus:border-emerald-500 outline-none transition"><option value="flat">Flat Cost Adder (₹)</option><option value="variable">Variable Cost Adder (₹ × Qty)</option><option value="percentage">MRP Percentage Adder (%)</option><option value="lookup">Standalone Lookup</option></select></div>
                </div>

                <div><label class="block text-[10px] font-bold mb-1 uppercase tracking-wide text-gray-500">Data Columns Needed</label><select id="schType" class="w-full border-2 border-gray-200 p-2.5 rounded-lg text-sm font-semibold focus:border-emerald-500 outline-none transition"><option value="1">1 Column</option><option value="2">2 Columns</option><option value="3">3 Columns</option><option value="4">4 Columns</option></select></div>
                
                <div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border-2 border-slate-100">
                    <div><label class="text-[10px] font-bold uppercase tracking-wide text-gray-500">Col 1 (Text)</label><input type="text" id="schCol1" value="Name" class="w-full border-2 border-white p-2 rounded-lg text-sm font-bold text-gray-800 outline-none transition focus:border-emerald-400 shadow-sm"></div>
                    <div id="schCol2Grp" class="hidden"><label class="text-[10px] font-bold uppercase tracking-wide text-gray-500">Col 2 (Cost/Value)</label><input type="text" id="schCol2" class="w-full border-2 border-white p-2 rounded-lg text-sm font-semibold text-gray-800 outline-none transition focus:border-emerald-400 shadow-sm"></div>
                    <div id="schCol3Grp" class="hidden"><label class="text-[10px] font-bold uppercase tracking-wide text-gray-500">Col 3 (Cost/Value)</label><input type="text" id="schCol3" class="w-full border-2 border-white p-2 rounded-lg text-sm font-semibold text-gray-800 outline-none transition focus:border-emerald-400 shadow-sm"></div>
                    <div id="schCol4Grp" class="hidden"><label class="text-[10px] font-bold uppercase tracking-wide text-gray-500">Col 4 (Cost/Value)</label><input type="text" id="schCol4" class="w-full border-2 border-white p-2 rounded-lg text-sm font-semibold text-gray-800 outline-none transition focus:border-emerald-400 shadow-sm"></div>
                </div>
            </div>

            <div class="flex justify-end space-x-3 border-t mt-6 pt-4">
                <button id="cancelSchemaBtn" class="px-5 py-2.5 bg-slate-200 rounded-lg font-bold text-slate-800 hover:bg-slate-300 transition">Cancel</button>
                <button id="saveSchemaBtn" class="px-5 py-2.5 bg-emerald-600 text-white font-bold rounded-lg shadow-lg shadow-emerald-500/30 hover:bg-emerald-700 transition">Deploy Master</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, setDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        // VIP FIREBASE KEYS
        const firebaseConfig = { apiKey: "AIzaSyAYOA07Rta4_vXODvdoC1zIIeM4tRv5Jgs", authDomain: "renuka-tools-quote.firebaseapp.com", databaseURL: "https://renuka-tools-quote-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "renuka-tools-quote", storageBucket: "renuka-tools-quote.firebasestorage.app", messagingSenderId: "300959855269", appId: "1:300959855269:web:d8d19e979ac3616b10934c" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
        const ADMIN_EMAILS = ["anandmulay@renukatools.in", "renukatools.rt@gmail.com"]; 
        
        // STRICT BANNED LIST (Purchase team CANNOT see these modules)
        const BANNED_SCHEMAS = ['roles', 'users', 'customers', 'customer_tiers', 'tool_categories', 'payment_terms', 'inco_terms'];

        let appSchemas = []; let mst = {}; let currentTabId = "raw_materials"; let pendingImportCollection = "";
        let unsubSchemas = null; let unsubTable = null;

        window.toggleSidebar = () => {
            const sb = document.getElementById('sidebar'); const overlay = document.getElementById('mobileOverlay');
            if(sb.classList.contains('-translate-x-full')) { sb.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); } 
            else { sb.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
        };

        onAuthStateChanged(auth, (user) => { 
            if (user) { 
                document.getElementById('loginScreen').classList.add('hidden'); 
                document.getElementById('userBadge').innerText = user.email;
                setupRealTimeSync(); 
            } else { 
                document.getElementById('loginScreen').classList.remove('hidden'); 
                if(unsubSchemas) unsubSchemas(); if(unsubTable) unsubTable();
            } 
        });

        document.getElementById('loginBtn').addEventListener('click', () => {
            const btn = document.getElementById('loginBtn'); btn.innerHTML = `<div class="animate-spin rounded-full h-5 w-5 border-t-2 border-b-2 border-white"></div>`;
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).catch(() => { alert("Invalid credentials"); btn.innerHTML = "Access Cost Master"; });
        });
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        // REAL-TIME SYNC ENGINE
        function setupRealTimeSync() {
            if(unsubSchemas) unsubSchemas();
            unsubSchemas = onSnapshot(collection(db, "system_schemas"), (snap) => {
                appSchemas = [];
                snap.forEach(doc => { 
                    const data = doc.data();
                    // Dynamic Fencing: Only allow Cost/MFG schemas that are active
                    if(!BANNED_SCHEMAS.includes(data.id) && data.isActive !== false) {
                        appSchemas.push(data); 
                    }
                });
                renderSidebar();
                
                if(!currentTabId && appSchemas.length > 0) currentTabId = appSchemas[0].id;
                if(currentTabId) mountTableListener(currentTabId);
            });
        }

        function renderSidebar() {
            document.getElementById('nav-mfg').innerHTML = ""; document.getElementById('nav-com').innerHTML = "";
            appSchemas.forEach(sch => {
                const targetDiv = sch.category === 'mfg' ? 'nav-mfg' : 'nav-com';
                const btn = document.createElement('button'); 
                btn.className = `w-full text-left px-4 py-2 sm:px-6 sm:py-2 text-xs sm:text-sm font-bold transition-all hover:bg-slate-800 rounded-lg mb-1 ${sch.id === currentTabId ? 'active-nav' : 'text-slate-400'}`; 
                btn.innerText = sch.title;
                btn.onclick = () => { 
                    currentTabId = sch.id; 
                    if(window.innerWidth < 1024) toggleSidebar();
                    renderSidebar(); mountTableListener(sch.id); 
                };
                if(document.getElementById(targetDiv)) document.getElementById(targetDiv).appendChild(btn); else document.getElementById('nav-mfg').appendChild(btn);
            });
        }

        function mountTableListener(schemaId) {
            const sch = appSchemas.find(s => s.id === schemaId); if(!sch) return;
            document.getElementById('pageTitle').innerText = sch.title;
            
            document.getElementById('topActionButtons').innerHTML = `
                <button onclick="window.downloadTemplate('${sch.id}')" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2 sm:px-4 sm:py-2 rounded-lg text-[10px] sm:text-xs font-bold shadow-lg shadow-yellow-500/30 transition flex items-center"><span class="hidden sm:inline mr-1">📥 </span>Template</button>
                <button onclick="window.triggerImport('${sch.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 sm:px-4 sm:py-2 rounded-lg text-[10px] sm:text-xs font-bold shadow-lg shadow-indigo-500/30 transition flex items-center"><span class="hidden sm:inline mr-1">📤 </span>Import</button>
                <button onclick="window.openEntryModal('${sch.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 sm:px-5 sm:py-2 rounded-lg text-[10px] sm:text-xs font-bold shadow-lg shadow-emerald-500/30 transition flex items-center">+ Add Record</button>`;
                
            let thHtml = sch.cols.map(c => `<th class="px-4 py-4 border-b font-black">${c}</th>`).join('');
            document.getElementById('tableContainer').innerHTML = `<div class="overflow-x-auto"><table class="w-full text-left whitespace-nowrap"><thead class="bg-slate-100 text-slate-500 text-[10px] sm:text-xs uppercase tracking-wider"><tr>${thHtml}<th class="px-4 py-4 border-b w-24 font-black">Status</th><th class="px-4 py-4 border-b text-right w-24 font-black">Actions</th></tr></thead><tbody id="tbody_${sch.id}" class="text-xs sm:text-sm divide-y divide-slate-100"><tr><td colspan="6" class="text-center py-10 text-slate-400 font-bold"><div class="animate-pulse">Loading live data...</div></td></tr></tbody></table></div>`;

            if(unsubTable) unsubTable();
            unsubTable = onSnapshot(collection(db, schemaId), (snap) => {
                mst[schemaId] = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderTableData(schemaId);
            });
        }

        function renderTableData(schemaId) {
            const sch = appSchemas.find(s => s.id === schemaId);
            let html = "";
            if(mst[schemaId].length === 0) { html = `<tr><td colspan="6" class="text-center py-12 text-slate-400 font-semibold">No records found. Click "+ Add Record" to begin.</td></tr>`; } 
            else { mst[schemaId].forEach(d => {
                const activeBadge = (d.isActive !== false) ? `<span class="bg-emerald-100 text-emerald-700 text-[9px] sm:text-[10px] px-2.5 py-1 rounded-full font-black border border-emerald-200">Active</span>` : `<span class="bg-red-100 text-red-700 text-[9px] sm:text-[10px] px-2.5 py-1 rounded-full font-black border border-red-200">Inactive</span>`;
                let trCols = `<td class="px-4 py-3 font-black text-slate-800">${d.name || ''}</td>`;
                if(sch.params >= 2) trCols += `<td class="px-4 py-3 text-slate-600 font-medium">${sch.id === 'inserts' ? (d.param1 || '-') : (d.param1 || 0)}</td>`; 
                if(sch.params >= 3) trCols += `<td class="px-4 py-3 text-slate-600 font-medium truncate max-w-[150px] sm:max-w-[200px]">${d.param2 || 0}</td>`; 
                if(sch.params >= 4) trCols += `<td class="px-4 py-3 text-slate-600 font-medium">${d.param3 || 0}</td>`;
                html += `<tr class="hover:bg-emerald-50 transition-colors">${trCols}<td class="px-4 py-3">${activeBadge}</td><td class="px-4 py-3 text-right space-x-3"><button class="text-emerald-600 hover:text-emerald-800 font-black text-[10px] tracking-wide" onclick="window.openEntryModal('${sch.id}', '${d.id}')">EDIT</button><button class="text-red-500 hover:text-red-700 font-black text-[10px] tracking-wide" onclick="window.deleteItem('${sch.id}','${d.id}')">DEL</button></td></tr>`;
            }); }
            const tBody = document.getElementById(`tbody_${schemaId}`);
            if(tBody) tBody.innerHTML = html;
        }

        window.openEntryModal = (schemaId, docId = "") => {
            const sch = appSchemas.find(s => s.id === schemaId); let eData = {}; if (docId) eData = mst[schemaId].find(x => x.id === docId) || {};
            document.getElementById('modalTitle').innerText = docId ? `Edit ${sch.title}` : `New ${sch.title}`; document.getElementById('activeCollection').value = sch.id; document.getElementById('activeDocId').value = docId;
            [2,3,4].forEach(n => document.getElementById(`grp${n}`).classList.add('hidden')); 
            document.getElementById('inp1').value = eData.name || ""; document.getElementById('inp2').value = eData.param1 || ""; document.getElementById('inp3').value = eData.param2 || ""; document.getElementById('inp4').value = eData.param3 || ""; document.getElementById('isActive').checked = eData.isActive !== false;
            document.getElementById('lbl1').innerText = sch.cols[0]; if(sch.params >= 2) { document.getElementById('grp2').classList.remove('hidden'); document.getElementById('lbl2').innerText = sch.cols[1]; } if(sch.params >= 3) { document.getElementById('grp3').classList.remove('hidden'); document.getElementById('lbl3').innerText = sch.cols[2]; } if(sch.params >= 4) { document.getElementById('grp4').classList.remove('hidden'); document.getElementById('lbl4').innerText = sch.cols[3]; }
            document.getElementById('dataModal').classList.remove('hidden');
        };

        document.getElementById('cancelModalBtn').addEventListener('click', () => document.getElementById('dataModal').classList.add('hidden'));
        document.getElementById('saveDataBtn').addEventListener('click', async () => {
            const col = document.getElementById('activeCollection').value; const id = document.getElementById('activeDocId').value; const sch = appSchemas.find(s => s.id === col);
            const dataObj = { name: document.getElementById('inp1').value, isActive: document.getElementById('isActive').checked }; 
            
            if (sch.params >= 2) dataObj.param1 = col === 'inserts' ? document.getElementById('inp2').value : Number(document.getElementById('inp2').value);
            if (sch.params >= 3) dataObj.param2 = Number(document.getElementById('inp3').value);
            if (sch.params >= 4) dataObj.param3 = Number(document.getElementById('inp4').value);
            
            try { 
                if (id) await updateDoc(doc(db, col, id), dataObj); else await addDoc(collection(db, col), dataObj); 
                document.getElementById('dataModal').classList.add('hidden'); 
            } catch (err) { alert("Error saving data."); }
        });

        window.deleteItem = async (col, id) => { if(confirm("Permanently delete? Warning: Will affect Historic Quotes.")) { await deleteDoc(doc(db, col, id)); } };

        // PURCHASE TEAM: DECENTRALIZED MASTER CREATION (Fixed Category Trap)
        document.getElementById('schemaBuilderBtn').addEventListener('click', () => { document.getElementById('schemaModal').classList.remove('hidden'); if(window.innerWidth < 1024) toggleSidebar(); }); 
        document.getElementById('cancelSchemaBtn').addEventListener('click', () => document.getElementById('schemaModal').classList.add('hidden')); 
        document.getElementById('schType').addEventListener('change', (e) => { const val = Number(e.target.value); document.getElementById('schCol2Grp').classList.toggle('hidden', val < 2); document.getElementById('schCol3Grp').classList.toggle('hidden', val < 3); document.getElementById('schCol4Grp').classList.toggle('hidden', val < 4); });
        
        document.getElementById('saveSchemaBtn').addEventListener('click', async () => { 
            const title = document.getElementById('schTitle').value; if(!title) return alert("Title required"); 
            const id = title.toLowerCase().replace(/[^a-z0-9]/g, '_'); 
            
            // Purchase Team explicitly chooses Mfg or Commercial category
            const category = document.getElementById('schCat').value;
            const behavior = document.getElementById('schBehavior').value; 
            const params = Number(document.getElementById('schType').value); 
            let cols = [document.getElementById('schCol1').value]; 
            if(params >= 2) cols.push(document.getElementById('schCol2').value); 
            if(params >= 3) cols.push(document.getElementById('schCol3').value); 
            if(params >= 4) cols.push(document.getElementById('schCol4').value); 
            
            await setDoc(doc(db, "system_schemas", id), { id, title, params, cols, behavior, category: category, isActive: true }); 
            document.getElementById('schemaModal').classList.add('hidden'); 
            alert(`New Costing Master "${title}" deployed successfully! It is now live in the Sales Engine.`);
        });

        // EXCEL IMPORTS
        window.downloadTemplate = (schemaId) => { const sch = appSchemas.find(s => s.id === schemaId); const ws = XLSX.utils.aoa_to_sheet([sch.cols]); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Template"); XLSX.writeFile(wb, `${sch.title}_Template.xlsx`); }; 
        window.triggerImport = (schemaId) => { pendingImportCollection = schemaId; document.getElementById('excelUpload').click(); };
        document.getElementById('excelUpload').addEventListener('change', (e) => { 
            const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); 
            reader.onload = async (event) => { 
                const workbook = XLSX.read(new Uint8Array(event.target.result), {type: 'array'}); const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]); const sch = appSchemas.find(s => s.id === pendingImportCollection); let count = 0; const b = writeBatch(db);
                for(let row of jsonData) { 
                    const dataObj = { name: String(row[sch.cols[0]] || "Unnamed"), isActive: true }; 
                    if(sch.params >= 2) dataObj.param1 = pendingImportCollection === 'inserts' ? String(row[sch.cols[1]]||"") : Number(row[sch.cols[1]] || 0); 
                    if(sch.params >= 3) dataObj.param2 = Number(row[sch.cols[2]] || 0); 
                    if(sch.params >= 4) dataObj.param3 = Number(row[sch.cols[3]] || 0); 
                    b.set(doc(collection(db, pendingImportCollection)), dataObj); count++; 
                } 
                await b.commit();
                document.getElementById('excelUpload').value = ""; alert(`Imported ${count} items globally!`); 
            }; 
            reader.readAsArrayBuffer(file); 
        });
        window.exportExcel = async (schemaId) => { const sch = appSchemas.find(s => s.id === schemaId); let dataArr = mst[schemaId].map(d => { let row = {}; row[sch.cols[0]] = d.name; if(sch.params >= 2) row[sch.cols[1]] = d.param1; if(sch.params >= 3) row[sch.cols[2]] = d.param2; if(sch.params >= 4) row[sch.cols[3]] = d.param3; row["Is Active"] = (d.isActive !== false) ? "Yes" : "No"; return row; }); const ws = XLSX.utils.json_to_sheet(dataArr); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sch.title); XLSX.writeFile(wb, `${sch.title}_Export.xlsx`); };
    </script>
</body>
</html>
