<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renuka Tools | Enterprise Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); }
        .app-card { transition: all 0.3s ease; }
        .app-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans text-gray-800">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="flex-1 flex items-center justify-center">
        <div class="max-w-md w-full bg-white p-10 rounded-xl shadow-2xl">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-black text-gray-900 tracking-tight">RENUKA TOOLS</h2>
                <p class="text-sm text-gray-500 mt-2 font-semibold uppercase tracking-widest">Enterprise Unified Portal</p>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Work Email</label>
                    <input type="email" id="email" placeholder="name@renukatools.in" class="w-full border-2 border-gray-200 p-3 rounded focus:border-blue-600 outline-none transition font-semibold">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Password</label>
                    <input type="password" id="password" placeholder="••••••••" class="w-full border-2 border-gray-200 p-3 rounded focus:border-blue-600 outline-none transition font-semibold">
                </div>
                <button id="loginBtn" class="w-full bg-blue-700 hover:bg-blue-800 text-white p-4 rounded-lg font-bold shadow-lg transition text-lg mt-2">Access Hub</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP LAUNCHER DASHBOARD -->
    <div id="portalScreen" class="hidden flex-1 flex flex-col">
        <nav class="bg-white/10 backdrop-blur-md border-b border-white/20 p-5 flex justify-between items-center shadow-lg">
            <h1 class="text-2xl font-black text-white tracking-widest">RENUKA TOOLS <span class="text-blue-400 font-light">| HUB</span></h1>
            <div class="flex items-center space-x-6">
                <div class="text-right">
                    <p class="text-sm font-bold text-white" id="userDisplay">Loading...</p>
                    <p class="text-[10px] font-bold text-blue-300 uppercase tracking-widest" id="roleDisplay">Verifying Clearance</p>
                </div>
                <button id="logoutBtn" class="bg-red-500/20 hover:bg-red-500/40 text-red-100 border border-red-500/50 px-5 py-2 rounded font-bold transition text-sm">Sign Out</button>
            </div>
        </nav>

        <main class="flex-1 flex items-center justify-center p-8">
            <div class="max-w-6xl w-full">
                <h2 class="text-3xl font-bold text-white mb-8 border-b border-white/20 pb-4">Select Workspace</h2>
                
                <div id="moduleGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <!-- Cards injected here via JS based on permissions -->
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyAYOA07Rta4_vXODvdoC1zIIeM4tRv5Jgs", 
            authDomain: "renuka-tools-quote.firebaseapp.com", 
            databaseURL: "https://renuka-tools-quote-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "renuka-tools-quote", 
            storageBucket: "renuka-tools-quote.firebasestorage.app", 
            messagingSenderId: "300959855269", 
            appId: "1:300959855269:web:d8d19e979ac3616b10934c" 
        };
        const app = initializeApp(firebaseConfig); 
        const auth = getAuth(app); 
        const db = getFirestore(app);

        const ADMIN_EMAILS = ["anandmulay@renukatools.in", "renukatools.rt@gmail.com"]; 

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('portalScreen').classList.remove('hidden');
                document.getElementById('userDisplay').innerText = user.email;
                await resolvePermissions(user.email);
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('portalScreen').classList.add('hidden');
            }
        });

        document.getElementById('loginBtn').addEventListener('click', () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, e, p).catch(() => alert("Invalid Credentials"));
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        async function resolvePermissions(email) {
            let isAdmin = ADMIN_EMAILS.includes(email);
            let roles = [];
            let isSales = false; let isDesign = false; let isPurchase = false;

            if (isAdmin) {
                roles = ["Master Admin"];
                isSales = true; isDesign = true; isPurchase = true;
            } else {
                try {
                    const uSnap = await getDocs(collection(db, "users"));
                    uSnap.forEach(doc => {
                        let d = doc.data();
                        if (d.param1 === email && d.param2) {
                            roles = d.param2.split(',').map(r => r.trim());
                        }
                    });

                    if (roles.includes("Design Team")) { isDesign = true; }
                    if (roles.includes("Purchase Team")) { isPurchase = true; }
                    // If they have any role that isn't specifically isolated to back-office, they get Sales CRM
                    if (roles.length > 0 && (!roles.includes("Design Team") || roles.length > 1) && (!roles.includes("Purchase Team") || roles.length > 1)) {
                        isSales = true;
                    }
                } catch(e) {
                    console.error("Error fetching roles", e);
                }
            }

            document.getElementById('roleDisplay').innerText = roles.length > 0 ? roles.join(' | ') : "No Roles Assigned";
            
            const grid = document.getElementById('moduleGrid');
            grid.innerHTML = "";

            if (isSales) {
                grid.innerHTML += `
                    <a href="sales.html" class="app-card bg-white rounded-xl overflow-hidden shadow-lg border-b-4 border-blue-600 block cursor-pointer">
                        <div class="bg-blue-50 p-6 flex justify-center items-center h-32"><span class="text-6xl">🛒</span></div>
                        <div class="p-5">
                            <h3 class="font-black text-gray-900 text-lg">Sales & CRM Engine</h3>
                            <p class="text-xs text-gray-500 mt-2 font-semibold">Guided quotes, AI margins, & executive PDF generation.</p>
                        </div>
                    </a>
                `;
            }

            if (isDesign) {
                grid.innerHTML += `
                    <a href="design.html" class="app-card bg-white rounded-xl overflow-hidden shadow-lg border-b-4 border-purple-600 block cursor-pointer">
                        <div class="bg-purple-50 p-6 flex justify-center items-center h-32"><span class="text-6xl">📐</span></div>
                        <div class="p-5">
                            <h3 class="font-black text-gray-900 text-lg">Design Library</h3>
                            <p class="text-xs text-gray-500 mt-2 font-semibold">N-Stage parametric CAD builder & master profile sync.</p>
                        </div>
                    </a>
                `;
            }

            if (isPurchase) {
                grid.innerHTML += `
                    <a href="purchase.html" class="app-card bg-white rounded-xl overflow-hidden shadow-lg border-b-4 border-emerald-600 block cursor-pointer">
                        <div class="bg-emerald-50 p-6 flex justify-center items-center h-32"><span class="text-6xl">📦</span></div>
                        <div class="p-5">
                            <h3 class="font-black text-gray-900 text-lg">Purchase Master</h3>
                            <p class="text-xs text-gray-500 mt-2 font-semibold">Manage standard raw materials, inserts, and hardware costs.</p>
                        </div>
                    </a>
                `;
            }

            if (isAdmin) {
                grid.innerHTML += `
                    <a href="admin.html" class="app-card bg-white rounded-xl overflow-hidden shadow-lg border-b-4 border-red-600 block cursor-pointer">
                        <div class="bg-red-50 p-6 flex justify-center items-center h-32"><span class="text-6xl">⚙️</span></div>
                        <div class="p-5">
                            <h3 class="font-black text-gray-900 text-lg">Master Admin</h3>
                            <p class="text-xs text-gray-500 mt-2 font-semibold">Global schemas, user overrides, and company branding.</p>
                        </div>
                    </a>
                `;
            }

            if(grid.innerHTML === "") {
                grid.innerHTML = `<div class="col-span-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert"><strong class="font-bold">Access Denied! </strong><span class="block sm:inline">You do not have permission to view any modules. Contact Anand.</span></div>`;
            }
        }
    </script>
</body>
</html>
